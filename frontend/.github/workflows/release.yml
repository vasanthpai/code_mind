name: Release to Prod

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

on:
  workflow_dispatch:
    inputs:
      version_major:
        description: 'Version Major (e.g., 1)'
        required: true
        default: ''
      version_minor:
        description: 'Version Minor (e.g., 0)'
        required: true
        default: ''
      version_patch:
        description: 'Version Patch (e.g., 0)'
        required: true
        default: ''

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Output Release Version Info
        run: echo "✅ Deployed version ${{ github.event.inputs.version_major }}.${{ github.event.inputs.version_minor }}.${{ github.event.inputs.version_patch }} from branch main to production"
